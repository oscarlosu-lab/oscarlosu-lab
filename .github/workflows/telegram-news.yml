name: Telegram News & Releases

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      title:
        description: "Manual announcement title (leave empty for auto-sync)"
        required: false
        default: ""
      body:
        description: "Manual announcement message (ES / EN)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check releases and publish to Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_TITLE: ${{ inputs.title }}
          MANUAL_BODY: ${{ inputs.body }}
          INCLUDE_PRERELEASES: "true"
        run: python3 .github/scripts/notify_telegram.py

      - name: Commit updated state if changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain .github/state/telegram_seen.json)" ]; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/telegram_seen.json
          git commit -m "chore(telegram): update published news state"
          git push
